name: Build and Release
on:
  release:
    types:
      - created
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v6
        with:
          # disable shallow clone
          fetch-depth: 0

      - name: Setup node 😻
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
          # Configure NPM to point to Github's package registry.
          registry-url: https://npm.pkg.github.com/
          scope: '@chanzuckerberg'

      - name: Install Dependencies 🧶
        run: yarn install --immutable

      - name: Type check 📋
        run: yarn run types

      - name: Run CI Tests ✅
        run: yarn run test:ci
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CI: true

      - name: Build EDS 🛠️
        run: yarn build

      # Publish the package on Github's package registry for internal use. You should still
      # publish to the npm registry separately from this job.
      - name: Publish package to the Github registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}