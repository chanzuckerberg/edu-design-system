<!--
  Dark mode for Storybook's loading states (spinner and docs skeleton).

  These paint before the JS bundle loads EDS CSS, so neither `data-theme` nor the tokens exist yet.
  The script sets `data-theme` from the `theme` global in the iframe URL (the manager passes it as
  `globals=theme:dark`), and the styles use literal token values. Keep them in sync with
  src/tokens-dist/ts/colors(-dark).ts; light values are Storybook's defaults.
-->
<script>
  (function () {
    var globals = new URLSearchParams(window.location.search).get('globals') || '';
    var match = globals.match(/(?:^|;)theme:(light|dark)(?:;|$)/);
    if (match) {
      document.documentElement.dataset.theme = match[1];
    }
  })();
</script>
<style>

  :root {
    color-scheme: light dark;
  }
  html[data-theme='light'] {
    color-scheme: light;

  html[data-theme='dark'] {
    color-scheme: dark;
  }
